name: Deploy

# Sobe as três imagens no GHCR e aplica no VPS compartilhado (docs/deploy.md).
# Dispare com a branch/tag desejada em "Run workflow" ou publique uma tag v*.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v5

      # O GHCR só aceita caminho minúsculo; o owner do GitHub pode ter maiúscula.
      - id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # O VPS roda amd64; máquina arm64 exige trocar aqui e usar buildx.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.prefix.outputs.value }}/adpub-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Chave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf 'Host deploy\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking accept-new\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PORT" > ~/.ssh/config

      - name: Login no GHCR no servidor
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        # O host não tem login no GHCR (nenhum stack de lá usa registry privado).
        # Com o secret GHCR_PAT (PAT clássico com `read:packages`) o login é
        # feito pelo stdin, sem passar pela linha de comando; sem ele, assume
        # que os pacotes são públicos.
        run: |
          if [ -z "$GHCR_PAT" ]; then
            echo 'sem GHCR_PAT: assumindo pacotes públicos do GHCR'
            exit 0
          fi
          printf '%s' "$GHCR_PAT" | ssh deploy "docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin"

      - name: Levar compose, snippet do Caddy e backup
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/adpub' }}
        run: |
          scp infra/docker-compose.prod.yml infra/Caddyfile.snippet infra/backup.sh "deploy:${DEPLOY_PATH}/"
          ssh deploy "chmod +x '${DEPLOY_PATH}/backup.sh'"

      - name: Migrar e subir
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/adpub' }}
        run: |
          ssh deploy "set -eu
            cd '${DEPLOY_PATH}'
            test -f .env.prod || { echo 'falta .env.prod em ${DEPLOY_PATH} (veja docs/deploy.md)'; exit 1; }
            . ./.env.prod
            # O Caddy é do stack mcrm: sem a rede dele web/minio sobem sem rota.
            docker network inspect \"\${PROXY_NETWORK:-mcrm_internal}\" >/dev/null ||
              { echo 'rede do proxy ausente: o stack mcrm está no ar? (docs/deploy.md §3)'; exit 1; }
            export IMAGE_PREFIX='${{ steps.prefix.outputs.value }}' IMAGE_TAG='${{ github.sha }}'
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull api worker web
            docker compose -f docker-compose.prod.yml --env-file .env.prod run -T --rm migrate
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --wait --wait-timeout 180
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps"
