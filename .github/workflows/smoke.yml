name: Fumaça em sandbox

# T096 / Constituição V: toda mudança no pipeline de publicação exige fumaça em
# conta sandbox antes do deploy. Roda sob demanda e antes de publicar release.
on:
  workflow_dispatch:
  release:
    types: [prereleased, published]

concurrency:
  group: smoke-sandbox
  cancel-in-progress: false

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sandbox

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adpub
          POSTGRES_PASSWORD: adpub
          POSTGRES_DB: adpub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U adpub -d adpub"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgres://adpub:adpub@localhost:5432/adpub
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: adpub
      S3_REGION: us-east-1
      S3_ACCESS_KEY: adpubminio
      S3_SECRET_KEY: adpubminio123
      MASTER_KEY: ${{ secrets.MASTER_KEY }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_API_VERSION: v25.0
      META_TIER: limited
      AUTH_SECRET: smoke-auth-secret-smoke-auth-secret
      AUTH_ALLOWED_DOMAIN: empresa.com.br
      ANTHROPIC_API_KEY: smoke-anthropic-key
      LOG_LEVEL: warn
      # Conta de TESTE: o script cria anúncios PAUSED e os arquiva em seguida.
      SMOKE_META_TOKEN: ${{ secrets.SMOKE_META_TOKEN }}
      SMOKE_BUSINESS_ID: ${{ secrets.SMOKE_BUSINESS_ID }}
      SMOKE_AD_ACCOUNT_ID: ${{ secrets.SMOKE_AD_ACCOUNT_ID }}
      SMOKE_PAGE_ID: ${{ secrets.SMOKE_PAGE_ID }}
      SMOKE_LINK: ${{ vars.SMOKE_LINK }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # A imagem espelhada é arm64 (a mesma de produção); o runner é amd64.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: MinIO
        run: |
          docker run -d --name minio --platform linux/arm64 -p 9000:9000 \
            -e MINIO_ROOT_USER=adpubminio -e MINIO_ROOT_PASSWORD=adpubminio123 \
            ghcr.io/greed9797/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live; then break; fi
            sleep 2
          done

      - run: pnpm db:migrate

      - name: Fumaça na conta de teste (cria e arquiva 2 anúncios PAUSED)
        run: pnpm smoke:sandbox
