# Infra local do AdPub (quickstart §3). Nada aqui vai para produção.
# Portas publicáveis por env quando a máquina já tem Postgres/Redis local:
#   POSTGRES_PORT=55432 REDIS_PORT=56379 MINIO_PORT=59000 docker compose -f infra/docker-compose.yml up -d
name: adpub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adpub
      POSTGRES_PASSWORD: adpub
      POSTGRES_DB: adpub
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adpub -d adpub']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # O MinIO tirou as imagens públicas do Docker Hub e do Quay. Esta é a cópia
    # espelhada (amd64+arm64) da RELEASE.2025-09-07T16-13-09Z; ver docs/deploy.md.
    image: ghcr.io/greed9797/minio:RELEASE.2025-09-07T16-13-09Z
    platform: linux/arm64
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: adpubminio
      MINIO_ROOT_PASSWORD: adpubminio123
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
