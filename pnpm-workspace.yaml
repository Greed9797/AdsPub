packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 0

allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: true
  "@tailwindcss/oxide": true
  msgpackr-extract: false
  protobufjs: false
  '@astryxdesign/core': true
  '@astryxdesign/cli': true

onlyBuiltDependencies:
  - sharp
  - esbuild
  - unrs-resolver
  - "@tailwindcss/oxide"
